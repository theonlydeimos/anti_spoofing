defaults:
  - model: anti_spoofing
  - writer: wandb
  - metrics: anti_spoofing
  - datasets: anti_spoofing
  - dataloader: anti_spoofing
  - transforms: anti_spoofing
  - _self_

paths:
  data_root: ???

writer:
  run_name: "asvspoof2019_la_lcnn"
  epoch_metrics: ["LR", "train_loss", "dev_loss", "eval_eer"]

optimizer:
  _target_: torch.optim.Adam
  lr: 3e-4

lr_scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  gamma: 0.5
  step_size: 31730

loss_function:
  _target_: src.loss.AntiSpoofingLoss

trainer:
  log_step: 50
  n_epochs: 20
  epoch_len: null
  device_tensors: ["data_object", "labels"]
  resume_from: null
  device: auto
  override: false
  monitor: "min eval_EER"
  save_period: 5
  early_stop: ${trainer.n_epochs}
  save_dir: "saved"
  prediction_part: "eval"
  prediction_filename: "predictions.csv"
  seed: 1
